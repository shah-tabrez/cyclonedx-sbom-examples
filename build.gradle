plugins {
    id 'org.cyclonedx.bom' version '1.7.4'
}

cyclonedxBom {
    includeBomSerialNumber = true
    projectType = "application"
    schemaVersion = "1.4"
}

group 'cyclonedx-sbom-examples'
version '1.0-SNAPSHOT'

apply plugin: 'java'

sourceCompatibility = 1.8

repositories {
   mavenCentral()
}

dependencies {
    implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.1'
    implementation group: 'org.apache.struts', name: 'struts2-core', version: '2.5.10'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.1.5'
    implementation group: 'net.sf.ehcache', name: 'ehcache', version: '2.10.6'
}

